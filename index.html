<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="robots" content="noindex, nofollow">
<title>Гости 26.10</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#1d1b18; --muted:#7a746b; --line:#e6e0d6;
    --ok:#2f7d4f; --okbg:#e3f2e8; --no:#b23b3b; --nobg:#f7e3e3; --wait:#8a7a55; --accent:#1d1b18;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141311; --card:#1e1c19; --ink:#f1ece4; --muted:#9a9388; --line:#2e2b26;
      --ok:#6cc58f; --okbg:#1d3326; --no:#e07a7a; --nobg:#3a2020; --wait:#c8b78c; --accent:#f1ece4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:20px}
  .sub{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:8px;margin:10px 0 8px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .stat b{display:block;font-size:22px;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  input[type=search]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
  .filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
  .filters button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  main{padding:10px 16px 120px;max-width:720px;margin:0 auto}
  .g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
  .g.came{background:var(--okbg);border-color:transparent}
  .g.no{background:var(--nobg);border-color:transparent;opacity:.8}
  .top{display:flex;gap:10px;align-items:flex-start}
  .num{color:var(--muted);font-size:13px;min-width:22px;padding-top:2px}
  .who{flex:1;min-width:0}
  .name{font-weight:600}
  .role{color:var(--muted);font-size:13px}
  .role a{color:inherit}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
  .time{font-size:12px;color:var(--ok);margin-top:2px}
  .acts{display:flex;gap:6px;margin-top:10px}
  .acts button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 6px;font-size:15px}
  .acts .b-came.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .acts .b-no.on{background:var(--no);color:#fff;border-color:var(--no)}
  .note{width:100%;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--ink);font-size:14px}
  .add{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;margin-top:14px}
  .add h2{font-size:15px;margin:0 0 8px}
  .add input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:6px}
  .add button,.tools button{width:100%;padding:11px;border-radius:10px;border:0;background:var(--accent);color:var(--bg);font-size:15px}
  .tools{display:flex;gap:6px;margin-top:14px}
  .tools button{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .del{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
</style>
</head>
<body>
<header>
  <h1>Гости ужина 26.10</h1>
  <div class="sub">«Эшбери», 19:00–22:00 · отметки хранятся на этом телефоне</div>
  <div class="stats">
    <div class="stat ok"><b id="sCame">0</b><span>пришли</span></div>
    <div class="stat"><b id="sWait">0</b><span>ждём</span></div>
    <div class="stat no"><b id="sNo">0</b><span>не придут</span></div>
  </div>
  <input type="search" id="q" placeholder="Поиск: имя, ник, компания">
  <div class="filters" id="filters">
    <button data-f="all" class="on">Все</button>
    <button data-f="wait">Ждём</button>
    <button data-f="came">Пришли</button>
    <button data-f="no">Не придут</button>
    <button data-f="biz">Деловые</button>
    <button data-f="blog">Блогеры</button>
  </div>
</header>
<main>
  <div id="list"></div>

  <div class="add">
    <h2>Добавить гостя (пришёл без списка)</h2>
    <input id="newName" placeholder="Имя">
    <input id="newRole" placeholder="Кто он / ник / от кого">
    <button id="addBtn">Добавить и отметить «пришёл»</button>
  </div>

  <div class="tools">
    <button id="copyBtn">Скопировать итог</button>
    <button id="resetBtn">Сбросить отметки</button>
  </div>
</main>

<script>
const IG = h => 'https://www.instagram.com/' + h;
const BASE = [
  {n:1,  name:'Владимир Паланчика Ли', role:'гость вечера, «Дом БРИКС» (Камбоджа)', cat:'biz'},
  {n:2,  name:'Александр Пузанов', role:'бизнесмен и блогер', link:'https://youtube.com/@bigcambodia', linkText:'YouTube @bigcambodia', cat:'biz'},
  {n:3,  name:'Андрей Поляков', role:'бизнесмен, застройщик (Таиланд)', cat:'biz'},
  {n:4,  name:'Евгений', role:'бизнесмен', cat:'biz'},
  {n:5,  name:'Юлия Доровских', role:'владелец «ОКЛЭНД СПб» (остекление)', cat:'biz'},
  {n:6,  name:'Виктория Захарова', role:'основатель PR-агентства', ig:'vikitsza', cat:'biz'},
  {n:7,  name:'Татьяна + 1', role:'блогер', ig:'tinalova32', cat:'blog', plus:1},
  {n:8,  name:'Елена Леонидовна Яковлева', role:'❌ в списке Вики', ig:'lena_vogue', cat:'blog', initNo:true},
  {n:9,  name:'Дарья Владимировна Пуртова', role:'блогер', ig:'purtoshaa', cat:'blog'},
  {n:10, name:'Нелли Леонтьева', role:'блогер', ig:'nelly_v_pitere', cat:'blog'},
  {n:11, name:'Юлия', role:'блогер', ig:'mushka_u', cat:'blog'},
  {n:12, name:'Алёна Июньская', role:'блогер', ig:'iunyash', cat:'blog'},
  {n:13, name:'Татьяна Буланова', role:'певица', cat:'blog'},
  {n:15, name:'Евгения Александровна Гок', role:'блогер', ig:'gok_evgeniya', cat:'blog'},
  {n:16, name:'Женя Петрова', role:'блогер', ig:'jenya_petrova', cat:'blog'},
  {n:17, name:'Алёна', role:'блогер', ig:'aleno4ka03_07', cat:'blog'},
  {n:18, name:'Алёна Цветаева', role:'ведущая, блогер', ig:'alenatzvetaeva', cat:'blog'},
  {n:19, name:'@lozovaya_ys', role:'блогер', ig:'lozovaya_ys', cat:'blog'},
  {n:20, name:'Егор Глухих', role:'блогер', ig:'egorio_g', cat:'blog'},
  {n:21, name:'Леся Меркулова', role:'блогер', ig:'lesya_merkulova', cat:'blog'},
  {n:22, name:'@caroline.is.not.online', role:'блогер', ig:'caroline.is.not.online', cat:'blog'},
  {n:23, name:'@r.vikkkkki', role:'блогер', ig:'r.vikkkkki', cat:'blog'},
  {n:24, name:'@evshakova', role:'блогер', ig:'evshakova', cat:'blog'},
  {n:25, name:'@shoshina_s.a', role:'блогер', ig:'shoshina_s.a', cat:'blog'},
  {n:26, name:'Алиса Линева', role:'блогер', ig:'nakameru', cat:'blog'},
  {n:27, name:'Ксения Максимовна Войтенко', role:'инвестор, сооснователь «Хроники»', cat:'biz'},
  {n:28, name:'Даниил Сергеевич Крупка', role:'инвестор, основатель «Хроники»', cat:'biz'},
  {n:29, name:'Милена Титова', role:'основательница школы английского языка (от Полины)', cat:'biz'},
  {n:30, name:'Алина Александровна Веприкова', role:'предприниматель, проект в сфере нейросетей (от Милены)', cat:'biz'},
  {n:31, name:'Оксана Чернышова', role:'партнёр вечера, «Гильдия парфюмеров» (30 миниатюр в подарок)', cat:'biz'},
];
const KEY = 'gosti2610_v1';
let st;
try { st = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { st = null; }
if (!st) {
  st = {s:{}, notes:{}, t:{}, extra:[]};
  BASE.forEach(g => { if (g.initNo) st.s[g.n] = 'no'; });
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };
let filter = 'all';

const all = () => BASE.concat(st.extra);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  let came=0, wait=0, no=0;
  all().forEach(g => {
    const s = st.s[g.n] || 'wait', w = 1 + (g.plus||0);
    if (s==='came') came+=w; else if (s==='no') no+=w; else wait+=w;
  });
  sCame.textContent = came; sWait.textContent = wait; sNo.textContent = no;

  const rows = all().filter(g => {
    const s = st.s[g.n] || 'wait';
    if (['wait','came','no'].includes(filter) && s!==filter) return false;
    if (['biz','blog'].includes(filter) && g.cat!==filter) return false;
    if (q && !(g.name+' '+g.role+' '+(g.ig||'')+' '+(st.notes[g.n]||'')).toLowerCase().includes(q)) return false;
    return true;
  });
  list.innerHTML = rows.length ? rows.map(g => {
    const s = st.s[g.n] || 'wait';
    const link = g.ig ? `<a href="${IG(g.ig)}" target="_blank" rel="noopener">@${esc(g.ig)}</a>`
               : g.link ? `<a href="${g.link}" target="_blank" rel="noopener">${esc(g.linkText)}</a>` : '';
    const tag = g.extra ? '<span class="tag">добавлен</span>' : '';
    return `<div class="g ${s==='came'?'came':s==='no'?'no':''}">
      <div class="top">
        <div class="num">${g.extra?'+':g.n}</div>
        <div class="who">
          <div class="name">${esc(g.name)}${tag}</div>
          <div class="role">${esc(g.role)}${link?' · '+link:''}</div>
          ${s==='came'&&st.t[g.n]?`<div class="time">пришёл в ${st.t[g.n]}</div>`:''}
        </div>
        ${g.extra?`<button class="del" data-del="${g.n}" aria-label="Удалить">×</button>`:''}
      </div>
      <div class="acts">
        <button class="b-came ${s==='came'?'on':''}" data-id="${g.n}" data-s="came">✓ Пришёл</button>
        <button class="b-no ${s==='no'?'on':''}" data-id="${g.n}" data-s="no">Не придёт</button>
      </div>
      <input class="note" data-note="${g.n}" placeholder="заметка (оплата, +1, стол…)" value="${esc(st.notes[g.n]||'')}">
    </div>`;
  }).join('') : '<div class="empty">Никого не нашли</div>';
}

list.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b) {
    const id = b.dataset.id, s = b.dataset.s;
    if (st.s[id] === s) { delete st.s[id]; delete st.t[id]; }
    else {
      st.s[id] = s;
      if (s==='came') st.t[id] = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      else delete st.t[id];
    }
    save(); render(); return;
  }
  const d = e.target.closest('button[data-del]');
  if (d && confirm('Удалить этого гостя из списка?')) {
    st.extra = st.extra.filter(g => String(g.n)!==d.dataset.del);
    delete st.s[d.dataset.del]; save(); render();
  }
});
list.addEventListener('input', e => {
  const i = e.target.dataset.note;
  if (i) { st.notes[i] = e.target.value; save(); }
});
document.getElementById('q').addEventListener('input', render);
filters.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  filters.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
  render();
});
addBtn.addEventListener('click', () => {
  const name = newName.value.trim(); if (!name) return;
  const id = 'x' + Date.now();
  st.extra.push({n:id, name, role:newRole.value.trim()||'без списка', cat:'blog', extra:true});
  st.s[id] = 'came';
  st.t[id] = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  newName.value = ''; newRole.value = '';
  save(); render();
});
copyBtn.addEventListener('click', () => {
  const by = s => all().filter(g => (st.s[g.n]||'wait')===s)
    .map(g => '— ' + g.name + (st.t[g.n]?' ('+st.t[g.n]+')':'') + (st.notes[g.n]?': '+st.notes[g.n]:'')).join('\n') || '—';
  const txt = `Ужин 26.10, итог\n\nПришли (${sCame.textContent}):\n${by('came')}\n\nНе пришли / отказ (${sNo.textContent}):\n${by('no')}\n\nБез отметки (${sWait.textContent}):\n${by('wait')}`;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => alert('Итог скопирован, можно вставить в чат'))
    .catch(() => prompt('Скопируйте текст:', txt));
});
resetBtn.addEventListener('click', () => {
  if (!confirm('Сбросить все отметки, заметки и добавленных гостей?')) return;
  st = {s:{}, notes:{}, t:{}, extra:[]};
  BASE.forEach(g => { if (g.initNo) st.s[g.n] = 'no'; });
  save(); render();
});
render();
</script>
</body>
</html>
